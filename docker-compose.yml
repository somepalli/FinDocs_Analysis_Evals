services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6999:6333"
      - "7000:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    ipc: host
    ports:
      - "127.0.0.1:8900:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      VLLM_USE_V2_MODEL_RUNNER: "0"
      VLLM_SERVER_DEV_MODE: "1"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - --model
      - gaunernst/gemma-3-4b-it-int4-awq
      - --revision
      - 8f28faf05c382a2dd81a471090acdb23156eb354
      - --served-model-name
      - google/gemma-3-4b-it
      - --quantization
      - awq
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "1"
      - --enforce-eager
      - --mm-processor-cache-gb
      - "0"
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --enable-sleep-mode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8989:8989"
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      FINDOCIQ_DOCUMENT_ROOT: /data/documents
      FINDOCIQ_SOURCE_APPROVALS_FILE: ${FINDOCIQ_SOURCE_APPROVALS_FILE:-}
      FINDOCIQ_INGEST_TOKEN: ${FINDOCIQ_INGEST_TOKEN:?set FINDOCIQ_INGEST_TOKEN}
    volumes:
      - ./.artifacts/models:/app/.artifacts/models:ro
      - ./.artifacts/observability:/app/.artifacts/observability
      - ${FINDOCIQ_DOCUMENT_ROOT_HOST:-../FunderMatch_Data/findociq_documents}:/data/documents
    command:
      - findociq-api
      - --host
      - 0.0.0.0
      - --port
      - "8989"
      - --config
      - configs/api/docker.yaml
    depends_on:
      - qdrant
      - vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  huggingface_cache:
