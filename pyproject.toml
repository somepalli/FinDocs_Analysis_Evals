[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "findociq"
version = "0.2.0"
description = "Open-weights financial document intelligence for Indian filings"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.10.3",
  "PyMuPDF==1.27.2.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
api = ["uvicorn==0.52.1"]
docling = ["docling==2.62.0"]
gpu = [
  "torch==2.13.0",
  "torchvision==0.28.0",
]
observability = [
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-sdk==1.44.0",
]
retrieval = [
  "FlagEmbedding==1.4.0",
  "qdrant-client==1.18.0",
]
dev = [
  "httpx==0.28.1",
  "pylint==4.0.7",
  "pytest==8.3.4",
  "ruff==0.9.10",
]

[project.scripts]
findociq-ingest = "findociq.ingest.cli:main"
findociq-retrieval = "findociq.retrieve.cli:main"
findociq-evals = "evals.run:main"
findociq-reason = "findociq.reason.cli:main"
findociq-serve = "findociq.reason.serve:main"
findociq-api = "findociq.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/findociq", "evals"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
