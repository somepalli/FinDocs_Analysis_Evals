    require_basis: true
metrics:
  annual_revenue_crore:
    sources: [audited_financials]
    labels: ['revenue from operations', 'annual revenue', 'total revenue', 'turnover', 'net revenue']
    kind: money
    require_period: true
    require_basis: true
  pat_crore:
    sources: [audited_financials]
    labels: ['profit after tax', 'profit for the year', 'profit for the period', 'net profit after tax', 'profit/(loss) after tax', 'profit/(loss) for the year', 'profit/(loss) for the period', 'profit/(loss) for the year after tax']
    kind: money
    require_period: true
    require_basis: true
  ebitda_margin_pct:
    sources: [audited_financials]
    labels: ['ebitda margin']
    kind: percent
    require_period: true
    require_basis: true
  dscr:
    sources: [audited_financials]
    labels: ['debt service coverage ratio', 'dscr']
    kind: ratio
    require_period: true
    require_basis: true
  debt_to_equity:
    sources: [audited_financials]
    labels: ['debt equity ratio', 'debt to equity ratio', 'debt/equity ratio', 'debt-equity ratio', 'debt / equity']
    kind: ratio
    require_period: true
    require_basis: true
  debt_to_ebitda:
    sources: [audited_financials]
    labels: ['debt to ebitda', 'debt/ebitda']
    kind: ratio
    require_period: true
    require_basis: true
  collateral_cover:
    sources: [valuation, audited_financials]
    labels: ['collateral cover', 'security coverage ratio', 'security cover']
    kind: ratio
    require_period: true
    require_basis: false
  employee_count:
    sources: [payroll, registration, audited_financials]
    labels: ['total employees', 'number of employees', 'total persons employed', 'employee count']
    kind: count
    require_period: false
    require_basis: false
  years_operating:
    sources: [registration, agreement, audited_financials]
    labels: ['years operating', 'years of operations', 'years in operation']
    kind: count
    require_period: false
    require_basis: false
  borrower_name:
    entity_heading_pattern: '(?:[A-Z][A-Za-z&.,()\-]*[ \t]+){1,16}(?:LIMITED|Limited|LTD\.?|Ltd\.?|LLP)'
    sources: [registration, agreement, audited_financials]
    labels: ['legal name', 'name of enterprise', 'name of company', 'name of llp', 'borrower name']
    kind: text
    require_period: false
    require_basis: false
  industry:
