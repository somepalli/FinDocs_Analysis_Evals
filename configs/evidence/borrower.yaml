    require_period: false
    require_basis: false
  region:
    sources: [registration, utility_bill, agreement, audited_financials]
    labels: ['region', 'registered office', 'registered address', 'service address', 'address of enterprise']
    kind: text
    require_period: false
    require_basis: false
