    kind: money
    require_period: true
    require_basis: true
  ebitda_crore:
    sources: [audited_financials]
    labels: ['ebitda', 'operating profit ( EBITDA )', 'operating profit (EBITDA)', 'earnings before interest tax depreciation and amortisation']
    kind: money
    require_period: true
    require_basis: true
  cfads_crore:
    sources: [audited_financials]
    labels: ['cash flow available for debt service']
    kind: money
