name: FunderMatch contract compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --python 3.11 --extra dev
      - name: Verify producer contract snapshot
        run: uv run --frozen --no-sync python scripts/export_public_contract.py --check
      - name: Checkout FunderMatch consumer
        uses: actions/checkout@v4
        with:
          repository: somepalli/FunderMatch
          path: external/FunderMatch
      - name: Validate FunderMatch v1/v2 consumer models
        env:
          PYTHONPATH: external/FunderMatch/src
        run: >-
          uv run --frozen --no-sync python
          external/FunderMatch/scripts/validate_findociq_contract.py
          --contract contracts/findociq-public-http-contract.json
      - name: Validate shared production service identity policy
        env:
          PYTHONPATH: external/FunderMatch/src
        run: >-
          uv run --frozen --no-sync python -m fundermatch.security.service_identity
          verify-policy
          --fundermatch-policy external/FunderMatch/configs/guardrails/production.yaml
          --findociq-policy configs/guardrails/production.yaml
